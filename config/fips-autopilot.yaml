# Autopilot's bundled FIPS v0.5.0 node. The private identity is generated at
# runtime beside this file in the persistent /app/data/fips volume.
node:
  identity:
    persistent: true
  leaf_only: true
  control:
    enabled: true
    socket_path: /app/data/fips/control.sock
  rendezvous:
    nostr:
      enabled: true
      policy: open
      app: "wingman-fips-poc-v1"
      advertise: true

tun:
  enabled: true
  name: fips0
  mtu: 1280

# Autopilot only hosts services on this node. Client-side `.fips` DNS is
# provided by WMapp's bundled node, so a DNS listener is unnecessary here.
dns:
  enabled: false

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    advertise_on_nostr: true
    public: false
    accept_connections: true

peers: []
