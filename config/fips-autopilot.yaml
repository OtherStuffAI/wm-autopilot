# Autopilot's bundled FIPS v0.5.0 node. The private identity is generated at
# runtime beside this file in the persistent /app/data/fips volume.
node:
  identity:
    persistent: true
  leaf_only: true
  control:
    enabled: true
    socket_path: /app/data/fips/control.sock
  rendezvous:
    nostr:
      enabled: true
      policy: open
      app: "wingman-fips-poc-v1"
      advertise: true
      # PoC-only same-physical-LAN mitigation. This publishes RFC1918/ULA host
      # candidates through the encrypted Nostr traversal exchange; do not use
      # it as a remote/VPN traversal substitute.
      share_local_candidates: true
    lan:
      enabled: true
      scope: "wingman-fips-poc-v1"

tun:
  enabled: true
  name: fips0
  mtu: 1280

# Autopilot only hosts services on this node. Client-side `.fips` DNS is
# provided by WMapp's bundled node, so a DNS listener is unnecessary here.
dns:
  enabled: false

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    advertise_on_nostr: true
    public: false
    accept_connections: true

peers:
  # Pinned-IP bootstrap keeps the Autopilot reachable when direct Nostr/STUN
  # traversal cannot cross the client and server NATs. Noise authenticates the
  # peer npub, so the address is discovery only and does not become identity.
  - npub: "npub1qmc3cvfz0yu2hx96nq3gp55zdan2qclealn7xshgr448d3nh6lks7zel98"
    alias: "wingman-bootstrap"
    addresses:
      - transport: udp
        addr: "217.77.8.91:2121"
    connect_policy: auto_connect
